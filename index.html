<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mockup Layout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="./styles.css" rel="stylesheet">
</head>
<body class="bg-white">
  <!-- Top bar -->
  <div class="container-fluid topbar">
    <div class="container">
      <div class="row">
        <div class="col-12 d-flex justify-content-end align-items-center py-2 gap-3">
          <a href="#" class="text-dark fw-semibold text-decoration-none">FAQ</a>
          <a href="#" class="btn btn-sm rounded-pill login-btn px-3">Log in</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Centered card using Bootstrap cols -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-10 col-sm-8 col-md-6 col-lg-4">
        <div class="mock-card border border-2 rounded-0 bg-white">
          <div class="mock-card-header d-flex align-items-center position-relative">
            <button class="btn btn-link p-0 text-decoration-none text-dark close-icon" aria-label="Close">&times;</button>
          </div>
          <div class="mock-card-body"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
